name: Documentation

on:
  push:
    paths:
      - 'apps/web/content/**'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'apps/web/content/**'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/documentation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check French and English documentation parity
        run: node scripts/check-docs.mjs
