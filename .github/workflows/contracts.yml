name: Contracts
on:
  push:
    paths:
      - 'packages/contracts/**'
      - 'scripts/validate-contracts.py'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'scripts/validate-contracts.py'
      - '.github/workflows/contracts.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema[format]>=4.23,<5'
      - run: python scripts/validate-contracts.py
